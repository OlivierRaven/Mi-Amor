  <style>
    :root{
      --bg1:#f864da; /* rosa claro */
      --bg2:#d694ae; /* rosa pastel */
      --bg3:#f8b8cb; /* casi blanco */
      --text:#4a2333; /* ciruela */
      --accent:#e63972; /* fucsia */
      --accent-2:#ff7aa2; /* rosa vivo */
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      color:var(--text);
      background: radial-gradient(circle at 20% 0%, var(--bg2) 0%, var(--bg3) 40%, var(--bg1) 100%);
      overflow-x:hidden;
    }
    /* Corazones flotantes */
    .corazones{position:fixed; inset:0; pointer-events:none; z-index:0}
    .corazon{
      position:absolute;
      top:100vh;
      font-size:24px;
      opacity:0.9;
      animation:flotar linear forwards;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.1));
      will-change: transform, opacity;
    }
    @keyframes flotar{
      0%{transform:translateY(0) scale(1) rotate(0deg); opacity:1}
      100%{transform:translateY(-110vh) scale(1.6) rotate(360deg); opacity:0}
    }

    header{
      position:relative;
      z-index:1;
      text-align:center;
      padding: clamp(2rem, 6vw, 6rem) 1.5rem 2rem;
    }
    .titulo{
      font-size: clamp(2.2rem, 4.5vw + 1rem, 4rem);
      line-height:1.1;
      margin:0 0 .5rem;
      letter-spacing:.5px;
    }
    .sub{
      margin:0 auto;
      max-width:60ch;
      opacity:.85;
      font-size: clamp(1rem, 1.2vw + .6rem, 1.25rem);
    }

    .cinta{
      display:inline-block;
      margin-top:1.25rem;
      background:linear-gradient(90deg, var(--accent), var(--accent-2));
      color:white;
      padding:.45rem .85rem;
      border-radius:999px;
      font-weight:600;
      letter-spacing:.3px;
    }

    main{position:relative; z-index:1}
    .contenedor{
      max-width:980px;
      margin:0 auto;
      padding: 1rem 1.25rem 3rem;
      display:grid;
      gap:1.25rem;
    }

    .card{
      background:rgba(255,255,255,.7);
      backdrop-filter:saturate(140%) blur(6px);
      border:1px solid rgba(255, 61, 130, .15);
      border-radius:24px;
      padding:clamp(1rem, 2.5vw, 1.5rem);
      box-shadow:0 10px 30px rgba(230,57,114,.08);
    }
    .card h2{
      margin:.2rem 0 0.75rem;
      font-size: clamp(1.35rem, 2vw + .8rem, 1.8rem);
      display:flex; align-items:center; gap:.5rem;
    }
    .card h2 .emoji{font-size:1.2em}

    .carta{
      font-size:1.05rem; line-height:1.7; max-width:70ch;
    }

    .lista-amor{list-style:none; padding:0; margin:0; display:grid; gap:.65rem}
    .lista-amor li{
      display:flex; align-items:flex-start; gap:.6rem;
      background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.7));
      border:1px dashed rgba(230,57,114,.3);
      border-radius:16px; padding:.7rem .9rem;
    }
    .bala{font-size:1.1rem}

    .botones{display:flex; gap:.75rem; flex-wrap:wrap; margin-top:.5rem}
    .btn{
      background:white; border:2px solid var(--accent); color:var(--accent);
      padding:.6rem .9rem; border-radius:999px; font-weight:700; cursor:pointer;
      transition:.2s transform ease, .2s box-shadow ease, .2s background ease, .2s color ease;
    }
    .btn:hover{transform:translateY(-2px); box-shadow:0 8px 18px rgba(230,57,114,.2)}
    .btn.lleno{background:linear-gradient(90deg, var(--accent), var(--accent-2)); color:white; border-color:transparent}

    blockquote{
      margin:0; padding:1rem 1.2rem; border-left:6px solid var(--accent);
      background:rgba(255,255,255,.65); border-radius:14px;
      font-style:italic;
    }

    footer{
      text-align:center; padding:2rem 1rem 3rem; opacity:.75; z-index:1; position:relative
    }
    footer small{display:block}

    /* Corazones decorativos en las esquinas */
    .decoracion{
      position:fixed; z-index:0; pointer-events:none; opacity:.25;
    }
    .decoracion.arriba{top:8px; left:8px; font-size:44px}
    .decoracion.abajo{bottom:8px; right:12px; font-size:52px}

    /* Accesibilidad y modo reducido de movimiento */
    @media (prefers-reduced-motion: reduce){
      .corazon{animation-duration:0.01ms !important; animation-iteration-count:1 !important}
    }

    /* Gallery fixes */
    .galeria{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap:12px;
      margin-top:.5rem;
    }
    .mini{
      position:relative;
      overflow:hidden;
      border-radius:16px;
      background:rgba(255,255,255,.6);
      border:1px solid rgba(230,57,114,.2);
      aspect-ratio:1/1;
      box-shadow:0 6px 12px rgba(0,0,0,.08);
    }
    .mini img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transform:scale(1.02);
      transition:transform .25s ease;
    }
    .mini:hover img{transform:scale(1.06)}
  
    /* ===== Wedding additions ===== */
    html{scroll-behavior:smooth}
    h1,h2,.names{font-family: "Playfair Display", Georgia, "Times New Roman", serif}
    .topbar{position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:.6rem 1rem; background:rgba(255,255,255,.72); backdrop-filter:blur(8px); border-bottom:1px solid rgba(230,57,114,.15)}
    .topbar nav{display:flex; gap:1rem; flex-wrap:wrap}
    .topbar a{color:var(--text); text-decoration:none; font-weight:600; font-size:.92rem}
    .topbar a:hover{color:var(--accent)}
    .lang{display:flex; gap:.3rem}
    .lang button{background:white; border:2px solid var(--accent); color:var(--accent); border-radius:999px; padding:.25rem .65rem; font-weight:700; cursor:pointer}
    .lang button[aria-pressed="true"]{background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:white; border-color:transparent}
    .names{font-size:clamp(2.4rem,7vw+1rem,5rem); line-height:1.05; margin:.4rem 0}
    .names .amp{color:var(--accent); font-style:italic; padding:0 .15em}
    .fecha{font-size:clamp(1.1rem,1.5vw+.7rem,1.5rem); font-weight:600; margin:.5rem 0 1.5rem}
    .countdown{display:flex; justify-content:center; gap:.75rem; flex-wrap:wrap; margin:1rem 0 1.5rem}
    .countdown div{background:rgba(255,255,255,.78); border:1px solid rgba(230,57,114,.2); border-radius:18px; min-width:78px; padding:.7rem .5rem; box-shadow:0 8px 20px rgba(230,57,114,.1)}
    .countdown b{display:block; font-size:1.8rem; color:var(--accent); font-variant-numeric:tabular-nums}
    .countdown span{font-size:.8rem; text-transform:uppercase; letter-spacing:.06em}
    .hero-photo{width:min(300px,70vw); aspect-ratio:1; object-fit:cover; border-radius:50%; border:6px solid white; box-shadow:0 14px 34px rgba(230,57,114,.3); margin-bottom:1rem}
    .detalles{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:.9rem}
    .detalle{background:rgba(255,255,255,.85); border:1px dashed rgba(230,57,114,.3); border-radius:16px; padding:.9rem 1rem}
    .detalle h3{margin:0 0 .3rem; font-size:1rem; color:var(--accent)}
    .detalle p{margin:0}
    form.rsvp{display:grid; gap:.75rem; max-width:520px}
    form.rsvp label{display:grid; gap:.25rem; font-weight:600}
    form.rsvp input,form.rsvp select,form.rsvp textarea{font:inherit; padding:.6rem .8rem; border-radius:12px; border:1px solid rgba(230,57,114,.35); background:white}
    .btn:focus-visible,.lang button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
    .galeria .mini{cursor:zoom-in}
    #lightbox{position:fixed; inset:0; z-index:20; background:rgba(40,10,25,.88); display:none; align-items:center; justify-content:center; padding:1rem}
    #lightbox.open{display:flex}
    #lightbox img{max-width:100%; max-height:92vh; border-radius:12px}
    .cinta{margin-top:0}
  </style>
</head>

      }
    };
    const PHOTOS = ["1ca92bcb-e02e-4ba5-85ac-9c25fd37ab0e.jpg","1173f475-011b-431c-a20d-c0fcee2116cb.jpg","3998263c-9c9c-4133-ab3a-67f872112cc3.jpg","eafa4049-9d0b-4d08-89b4-cc17d272cd55.jpg","IMG_0219.jpeg","IMG_0265.jpeg","IMG_0990.jpeg","IMG_0994.jpeg","IMG_1063.jpeg","IMG_1088.jpeg","IMG_1120.jpeg","IMG_1205.jpeg","IMG_1302.jpeg","IMG_1321.jpeg","IMG_1385.jpeg","IMG_1422.jpeg","IMG_1858.PNG","IMG_6599.jpeg","IMG_7046.jpeg"];

    let lang = "es";
    const $ = (s, r=document) => r.querySelector(s);

    // Gallery
    const grid = $('#galeria-grid');
    PHOTOS.forEach(src => {
      const f = document.createElement('figure'); f.className = 'mini';
      const im = document.createElement('img'); im.src = src; im.loading = 'lazy';
      f.appendChild(im); grid.appendChild(f);
      f.addEventListener('click', () => { const lb = $('#lightbox'); $('img', lb).src = src; $('img', lb).alt = im.alt; lb.classList.add('open'); });
    });
    $('#lightbox').addEventListener('click', e => e.currentTarget.classList.remove('open'));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#lightbox').classList.remove('open'); });

    // Language
    function setLang(l) {
      if (!I18N[l]) l = 'es';
      lang = l; const t = I18N[l];
      document.documentElement.lang = l;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
      document.querySelectorAll('[data-i18n-alt]').forEach(el => { el.alt = t[el.dataset.i18nAlt]; });
      grid.querySelectorAll('img').forEach((im, i) => { im.alt = t.g[i] || ''; });
      document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === l));
      try { localStorage.setItem('lang', l); } catch (e) {}
      tick();
    }
    document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

    // Countdown
    function tick() {
      const t = I18N[lang], box = $('#countdown');
      const ms = WEDDING - new Date();
      if (ms <= 0) { box.textContent = t.married; return; }
      const v = [Math.floor(ms/864e5), Math.floor(ms/36e5)%24, Math.floor(ms/6e4)%60, Math.floor(ms/1e3)%60];
      box.innerHTML = v.map((n,i) => `<div><b>${n}</b><span>${t.cd[i]}</span></div>`).join('');
    }
    setInterval(tick, 1000);

    // RSVP (opens the guest's email app addressed to RSVP_EMAIL)
    if (RSVP_EMAIL) {
      $('#rsvp').hidden = false;
    } else {
      $('#nav-rsvp').style.display = 'none';
    }
    $('#rsvp-form').addEventListener('submit', e => {
      e.preventDefault();
      const f = new FormData(e.target), t = I18N[lang];
      const body = `${f.get('name')}\n${t.f_att} ${f.get('att') === 'yes' ? t.f_yes : t.f_no}\n${t.f_guests}: ${f.get('guests')}\n\n${f.get('msg')}`;
      location.href = `mailto:${RSVP_EMAIL}?subject=${encodeURIComponent(t.rsvp_subject)}&body=${encodeURIComponent(body)}`;
    });

    // Floating hearts
    const contenedor = $('#corazones');
    function crearCorazones(cuantos = 30) {
      const emojis = ['💖','❤️','💘','💝','💓','💕','💞'];
      for (let i = 0; i < cuantos; i++) {
        const el = document.createElement('span');
        el.className = 'corazon';
        el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        el.style.left = Math.random()*100 + 'vw';
        el.style.fontSize = (16 + Math.random()*36) + 'px';
        el.style.animationDuration = (6 + Math.random()*7) + 's';
        el.style.opacity = (0.7 + Math.random()*0.3).toFixed(2);
        contenedor.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }
    $('#btn-corazones').addEventListener('click', () => crearCorazones(35));
    window.addEventListener('DOMContentLoaded', () => crearCorazones(40));

    // Init: saved choice, else browser language
    let start = 'es';
    try { start = localStorage.getItem('lang'); } catch (e) {}
    if (!start) start = (navigator.language || 'es').slice(0,2);
    setLang(start);
  </script>
</body>
</html>
